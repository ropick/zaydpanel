<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>
  <!-- Server illustration -->
  <rect x="140" y="60" width="120" height="20" rx="4" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="248" cy="70" r="4" fill="#4ade80"/>
  <rect x="140" y="85" width="120" height="20" rx="4" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="248" cy="95" r="4" fill="#4ade80"/>
  <rect x="140" y="110" width="120" height="20" rx="4" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="248" cy="120" r="4" fill="#4ade80"/>
  <!-- Lines -->
  <line x1="152" y1="70" x2="200" y2="70" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
  <line x1="152" y1="95" x2="220" y2="95" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
  <line x1="152" y1="120" x2="190" y2="120" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
  <!-- Globe icon -->
  <circle cx="200" cy="180" r="25" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <ellipse cx="200" cy="180" rx="12" ry="25" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="175" y1="180" x2="225" y2="180" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Text -->
  <text x="200" y="235" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="22">ZaydCluster</text>
  <text x="200" y="258" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Arial,Helvetica,sans-serif" font-size="12">Web Hosting Panel</text>
</svg>
